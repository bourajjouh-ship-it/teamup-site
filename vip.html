<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamUp - Devenir VIP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #0f0f1a; color: white; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: #1a1a2e; }
    header h1 { color: #6c5ce7; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }

    .conteneur-vip {
      max-width: 500px;
      margin: 60px auto;
      background-color: #1a1a2e;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
    }

    .conteneur-vip h2 {
      color: #ffd700;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .prix {
      font-size: 40px;
      font-weight: bold;
      margin: 20px 0;
    }

    .prix span {
      font-size: 16px;
      color: #888;
    }

    ul {
      list-style: none;
      text-align: left;
      margin: 30px 0;
    }

    ul li {
      padding: 10px 0;
      color: #cccccc;
      border-bottom: 1px solid #333;
    }

    ul li::before {
      content: "✓ ";
      color: #6c5ce7;
      font-weight: bold;
    }

    button {
      width: 100%;
      background-color: #ffd700;
      color: #0f0f1a;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #e6c200;
    }

    .erreur {
      color: #e74c3c;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>TeamUp</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="feed.html">Trouver un coéquipier</a>
    </nav>
  </header>

  <div class="conteneur-vip">
    <h2>Passe VIP</h2>
    <div class="prix">4,99€ <span>/ mois</span></div>
    <ul>
      <li>Aucune pub</li>
      <li>Demandes de partie illimitées</li>
      <li>Badge VIP sur ton profil</li>
      <li>Profil mis en avant dans le feed</li>
      <li>Filtres avancés</li>
    </ul>
    <button id="btn-vip">Devenir VIP</button>
    <p id="message-erreur" class="erreur"></p>
  </div>

  <script>
    document.getElementById("btn-vip").addEventListener("click", function() {
      fetch("http://localhost:3000/api/creer-paiement-vip", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      })
        .then(res => res.json())
        .then(data => {
          if (data.url) {
            window.location.href = data.url;
          } else {
            document.getElementById("message-erreur").textContent = "Erreur, réessaie.";
          }
        })
        .catch(err => {
          document.getElementById("message-erreur").textContent = "Le serveur ne répond pas.";
        });
    });
  </script>

</body>
</html>
